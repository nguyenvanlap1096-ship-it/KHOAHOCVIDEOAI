<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Logo Khóa Học Video AI</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: transparent; }
  .mark { display: inline-flex; align-items: center; gap: 28px; padding: 40px 48px; font-family: "Be Vietnam Pro", sans-serif; }
  .mark img { width: 160px; height: 160px; }
  .name { font-size: 68px; font-weight: 800; letter-spacing: -.02em; color: #0F172A; line-height: 1; }
  .name span { background: linear-gradient(90deg, #F43F5E, #6D28D9); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin-top: 12px; font-size: 26px; font-weight: 600; color: #475569; }
</style>
</head>
<body>
  <div class="mark">
    <img src="../../public/img/logo.svg" alt="">
    <div>
      <div class="name">Khóa Học Video <span>AI</span></div>
      <div class="sub">khoahocvideoai.store</div>
    </div>
  </div>
</body>
</html>
